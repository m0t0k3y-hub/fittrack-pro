name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # ビルドには値の形だけあればよい（実際の接続はしない）
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # 使わないサービスは起動せず、時間とメモリを節約する。
      # 認証 (gotrue)、REST (postgrest)、メール受信箱 (mailpit)、DB、API ゲートウェイ (kong) は必要。
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,storage-api,realtime,postgres-meta

      - name: Export Supabase connection settings
        run: |
          status="$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$status" | grep '^API_URL=' | cut -d= -f2- | tr -d '"')"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$status" | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"

      - run: npx playwright install --with-deps chromium

      # CI=true のため、本番ビルドで起動して検証する (playwright.config.ts)
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
